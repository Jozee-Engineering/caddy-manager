name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile & import (stdlib only)
        run: |
          python -m py_compile app/server.py
          python - <<'PY'
          import os, sys, tempfile
          os.environ["ROUTES_PATH"] = tempfile.mktemp(suffix=".json")
          os.environ["AUTH_PATH"] = tempfile.mktemp(suffix=".json")
          os.environ["CADDYFILE_PATH"] = tempfile.mktemp(suffix=".caddy")
          sys.path.insert(0, "app")
          import server
          server.save_auth("tester", "password123")
          assert server.check_password("password123")
          assert not server.check_password("wrong")
          d = {"config": {"base_domain": "ex.com", "global_lines": ["admin :2019"]},
               "routes": [{"id": "a", "subdomain": "a", "upstream": "127.0.0.1:9",
                           "notes": "n", "before_proxy": "", "proxy_headers": "", "enabled": True}]}
          assert "# note: n" in server.render(d)
          print("smoke test OK")
          PY

  build-and-push:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
